components:
  schemas:
    Lesson:
      type: object
      properties:
        _id:
          type: string
        author:
          type: string
        title:
          type: string
        description:
          type: string
        content:
          type: string
        category:
          type: string
        resourceType:
          type: string
          enum:
            - lessons
            - attachments
            - questions
            - quizzes
        attachments:
          type: array
          items:
            type: string
