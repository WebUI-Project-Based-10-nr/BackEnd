components:
  schemas:
  Appearance:
    type: object
    properties:
      icon:
        type: string
        description: URL of the icon for the category
        example: 'https://www.svgrepo.com/show/532031/cloud-fog.svg'
      color:
        type: string
        description: Color of the icon
        example: '#66C42C'

  Category:
    properties:
    _id:
      type: string
      description: Unique identifier for the category (automatically generated by MongoDB)
      example: '66bd1977da1a3f609fe9a1af'
    name:
      type: string
      description: Unique name of the category
      example: 'Time Management'
    appearance:
      $ref: '#/components/schemas/Appearance'
